name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'excel_validation_api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/SahiData
            git pull
            sudo systemctl restart sahi-backend
